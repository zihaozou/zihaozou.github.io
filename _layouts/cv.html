---
layout: default
---
<!-- _layouts/cv.html -->
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }} {% if page.cv_pdf %}<a
        href="{{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url}}" target="_blank" rel="noopener noreferrer"
        class="float-right" aria-label="Download resume as PDF"><i class="fas fa-file-pdf" aria-hidden="true"></i></a>{% endif %}</h1>
    <p class="post-description">{{ page.description }}</p>
  </header>

  <article>
    <p>
      <a href="{{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url }}">Download resume (PDF)</a>
      {% if page.cv_html %}
        &middot; <a href="{{ page.cv_html | prepend: 'assets/pdf/' | relative_url }}">View HTML version</a>
      {% endif %}
    </p>
    {% if page.cv_html %}
      <iframe src="{{ page.cv_html | prepend: 'assets/pdf/' | relative_url }}"
        title="Zihao Zou's resume" width="100%" height="1100" style="border: 0;"></iframe>
    {% else %}
      {% pdf {{ page.cv_pdf | prepend: 'assets/pdf/' | relative_url }} %}
    {% endif %}
  </article>

</div>
